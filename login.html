<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인 - 보증서 서비스</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html">
      <span class="brand-mark">GC</span>
      <span>보증서 서비스</span>
    </a>
    <nav class="nav-links">
      <a href="index.html">홈</a>
      <a href="issue.html">발급</a>
      <a href="lookup.html">조회</a>
      <a href="login.html" class="active" id="nav-auth">로그인</a>
    </nav>
  </div>
</header>

<main class="container">
  <section class="card auth-card">
    <h1 id="auth-title">로그인</h1>
    <form id="auth-form" novalidate>
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="field" style="margin-top: 14px;">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="6자 이상" required />
      </div>
      <div class="form-error" id="form-error"></div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block" id="auth-submit">로그인</button>
      </div>
    </form>
    <div class="auth-toggle-row">
      <span id="auth-toggle-text">계정이 없으신가요?</span>
      <button type="button" id="auth-toggle">회원가입</button>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">© 2026 보증서 서비스</div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/login.js"></script>
</body>
</html>
