name: Android Build

on:
  push:
    branches: [claude/construction-equipment-guarantee-app-czi1cw]
    paths: ["android/**", "capacitor.config.ts", "www/**", "package.json"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: machinsure
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Check for release keystore secret
        id: check_keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: android
        # ANDROID_KEYSTORE_PATH(release.keystore)는 android/app/build.gradle의
        # storeFile file(...) 호출 안에서 app 모듈 디렉터리(android/app) 기준으로
        # 해석되므로, 여기서도 android/app/release.keystore로 만들어야 한다.
        run: echo "$KEYSTORE_B64" | base64 -d > app/release.keystore

      - name: Build signed release AAB (Play Store)
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload release AAB
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: machinsure-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
